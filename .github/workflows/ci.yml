# Build, test and pack on every push and pull request. MO2 runs stay manual (they need the user's desktop);
# the Scale run is on demand. Nothing here publishes anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scale:
        description: Also run the Scale measurements
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Synthesis reads `dotnet build` output to the end; reused build servers would hold it open (see CLAUDE.md).
  MSBUILDDISABLENODEREUSE: "1"

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The pinned Synthesis CLI (built from source) and MO2, fetched by eng/e2e-tools/Get-E2ETools.ps1.
      - name: Cache end-to-end tools
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\SafePatch\e2e-tools
          key: e2e-tools-${{ hashFiles('eng/e2e-tools/Get-E2ETools.ps1') }}

      - name: Build
        run: dotnet build -c Release

      - name: Fast tests and fuzzing
        run: dotnet test -c Release --no-build --filter "Category!=Sandbox&Category!=Build&Category!=Synthesis&Category!=MO2&Category!=Scale"

      - name: Sandbox and generated-patcher builds
        run: dotnet test -c Release --no-build --filter "Category=Sandbox|Category=Build"

      - name: Synthesis end to end
        run: dotnet test -c Release --no-build --filter "Category=Synthesis"

      - name: Scale measurements
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scale }}
        run: dotnet test -c Release --no-build --filter "Category=Scale" --logger "console;verbosity=detailed"

  pack:
    name: Pack
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack the runtime and the tools
        run: |
          dotnet pack src/SafePatch.Synthesis -c Release -o artifacts -p:SkipE2ETools=true
          dotnet pack src/SafePatch.Cli -c Release -o artifacts -p:SkipE2ETools=true
          dotnet pack src/SafePatch.Mcp -c Release -o artifacts -p:SkipE2ETools=true

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
